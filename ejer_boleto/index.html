<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Boleto de La Quiniela</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="boleto">

    <header class="cabecera">
        <div class="cabecera">
            <div class="logo-loteria">
            <img src="./images/logo_loterias.png" alt="Logotipo Lotería Nacional">
            </div>
            <div class="sencillo-multiple">
            <h1>SENCILLO-MÚLTIPLE</h1>
            <span>261</span>
            </div>
            <div class="logo-quiniela">
            <img src="./images/logo_quiniela.jpg" alt="Logotipo La Quiniela">
            </div>
        </div>
    </header>

    <section class="instrucciones">
        <p>SENCILLAS: Marque 14 signos por bloque...</p>
        <p>MÚLTIPLES: Marque los pronósticos...</p>
    </section>

    <section class="datos-jornada">
        <strong>1.ª Liga BBVA / 2.ª Liga Adelante</strong>
        <span>JORNADA: 1.ª</span>
        <span>FECHA: 23-8-15</span>
    </section>

    <section class="zona-central">

        <div class="zona-pronosticos">

            <div class="encabezado-pronosticos">
                <h2>PRONÓSTICOS</h2>
            </div>

            <div class="lista-partidos">
                <!-- 14 filas con número y equipos -->
            </div>

            <div class="matriz-pronosticos">
                <!-- 8 bloques de pronósticos -->
                <!-- Cada bloque contiene 14 filas -->
                <!-- Cada fila tiene las opciones 1, X y 2 -->
            </div>

        </div>

        <aside class="combinaciones">
            <h2>COMBINACIONES</h2>
            <div class="dobles">
                <!-- Casillas numeradas del 1 al 14 -->
            </div>
            <div class="triples">
                <!-- Casillas numeradas del 1 al 9 -->
            </div>
        </aside>

    </section>

    <footer class="pie-boleto">

        <div class="bien-mal">
            <!-- Casillas BIEN y MAL -->
        </div>

        <section class="pleno-al-15">
            <h2>PLENO AL 15</h2>
            <div class="equipo-local">
                AT. MADRID
                <!-- Opciones 0, 1, 2, M -->
            </div>
            <div class="equipo-visitante">
                LAS PALMAS
                <!-- Opciones 0, 1, 2, M -->
            </div>
        </section>

        <section class="bloques">
            <h2>BLOQUES</h2>
            <!-- Bloques numerados del 1 al 8 -->
        </section>

    </footer>

</main>

</body>
</html>

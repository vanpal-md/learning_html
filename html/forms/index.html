<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body> 
      <nav> <a href="../index.html">Volver al índice</a> </nav>
    <h1>Formulario de ejemplo con get</h1>
    <form action="./index.html" method="get">
        <ul>
    <li>
         <label for="login">Nombre de usuario:</label>
        <input type="text" name="login" placeholder="Tu usuario de la aplicación">
    </li>

    <li>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" placeholder="Tu contraseña de la aplicación">
    </li>

    <li>
        <label for="email">Mail:</label>
        <input type="email" name="email" placeholder="Tu dirección de correo electrónico" >  
    </li>
    <br>
    <button type="submit">Enviar</button>  
    <button type="reset">Limpiar</button>
        
    </ul>
    </form>
    <h1>Formulario de ejemplo con post</h1>
    <form action="./index.html" method="post">
        <ul>
    <li>
         <label for="login">Nombre de usuario:</label>
        <input type="text" name="login" placeholder="Tu usuario de la aplicación">
    </li>

    <li>
        <label for="password">Contraseña:</label>
        <input type="password" name="password" placeholder="Tu contraseña de la aplicación">
    </li>

    <li>
        <label for="email">Mail:</label>
        <input type="email" name="email" placeholder="Tu dirección de correo electrónico" >  
    </li>
    <br>
    <button type="submit">Enviar</button>  
    <button type="reset">Limpiar</button>
    <label for="estimation">Estimación:</label>
    <li>
        <select name="estimation">
            <option value="1">XS</option>
            <option value="2">S</option>
            <option value="3">M</option>
            <option value="4">L</option>
            <option value="5">XL</option>
        </select>
    </li>
     <li>
        <label for="payment">Tipo de pago:</label>
        <input type="radio" name="payment" value="credit_card">Tarjeta de crédito</input>
        <input type="radio" name="payment" value="paypal">PayPal</input> 
        <input type="radio" name="payment" value="bank_transfer">Transferencia bancaria</input>     
    </li>
     <li>
        <label for="contact">Contacto:</label>
        <input type="checkbox" name="contact" value="email">Correo electrónico</input>
        <input type="checkbox" name="contact" value="sms">SMS</input> 
        <input type="checkbox" name="contact" value="phone">Llamada telefónica</input>     
    </li>
    
    </ul>
    </form>
    <footer>

        <a href="../enlaces/index.html">Página de enlaces</a> |

        <a href="../images/index.html">Imágenes</a> | 
        <a href="../tablas/index.html">Tablas</a>
    </footer>
</body>
</html>
